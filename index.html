<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#253b55"><title>かぞく会議｜保存テスト</title><style>body{margin:0;background:#f6f3ee;color:#253b55;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#253b55;color:white;padding:22px}main{padding:16px;max-width:640px;margin:auto}.card{background:white;padding:18px;border-radius:16px;margin:12px 0}input{padding:12px;width:90%;font:inherit}button{border:0;border-radius:9px;background:#253b55;color:white;padding:12px;margin:7px 5px 7px 0;font:inherit}li{padding:8px}small{color:#667}</style><header><h1>かぞく会議</h1><div>いちか・にか・さんか</div></header><main><div class="card"><h2>議題箱</h2><input id="topic" placeholder="次に話したいこと"><button id="add">追加して保存</button><ul id="list"></ul></div><div class="card"><h2>端末保存のテスト</h2><button id="test">保存と読み出しを確認</button><p id="result"></p><button id="export">バックアップを保存</button><p><small>会議記録はこの端末のブラウザ保存領域に置かれます。Safariのデータ削除で失われる場合があります。</small></p></div><div class="card"><h2>ChatGPTとの受け渡し</h2><button id="copy">議題をコピー</button><p id="copied"></p><small>音声と自動同期は今後の検証対象です。</small></div></main><script>(()=>{const key="kazoku-kaigi-data-v1",el=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(key))||{version:1,topics:[]};if(!Array.isArray(data.topics))throw Error("データ形式が違います")}catch(e){el("result").textContent="読込エラー: "+e.message;return}function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){el("result").textContent="保存エラー: "+e.message;return false}}function render(){el("list").replaceChildren();data.topics.forEach((t,i)=>{const li=document.createElement("li");li.textContent=t+" ";const b=document.createElement("button");b.textContent="削除";b.onclick=()=>{data.topics.splice(i,1);if(save())render()};li.appendChild(b);el("list").appendChild(li)})}el("add").onclick=()=>{const t=el("topic").value.trim();if(!t)return;data.topics.push(t);if(save()){el("topic").value="";render()}};el("test").onclick=()=>{el("result").textContent=save()&&JSON.stringify(data)===localStorage.getItem(key)?"保存・読み出し成功":"保存の確認に失敗"};el("export").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="kazoku-kaigi-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};el("copy").onclick=async()=>{try{await navigator.clipboard.writeText("かぞく会議の議題: "+data.topics.join("、"));el("copied").textContent="コピーしました"}catch(e){el("copied").textContent="コピーに失敗しました"}};render()})();</script></html>
